    case "openteam":go("#/equipo/"+id);break;
    case "jointeam":{t.disabled=true;const tid=await run(sb.rpc("join_course_team",{code:J.code,tid:id}),"Te uniste al equipo");if(tid){J.preview=null;go("#/equipo/"+tid)}else t.disabled=false;break}
    case "copyinvite":{const code=t.dataset.code,url=location.origin+location.pathname;const msg=`¡Hola! Únete a nuestro equipo "${T.team.name}" en Bitácora Lean:\n1. Entra a ${url}\n2. Crea tu cuenta.\n3. Escribe el código ${code} en "Unirme con un código".`;
      try{await navigator.clipboard.writeText(msg);toast("Invitación copiada: pégala en WhatsApp o correo")}catch(err){toast("Copia el código: "+code)}break}
    case "copycode":{const code=t.dataset.code;try{await navigator.clipboard.writeText(code);toast("Código copiado: "+code)}catch(err){toast("Copia este código: "+code)}break}
    case "regencourse":inlineConfirm(t,"El código actual dejará de funcionar. ¿Continuar?","regencourse2");break;
    case "regencourse2":{t.disabled=true;if(await run(sb.rpc("regenerate_course_code",{cid:C.course.id}),"Código del curso cambiado")){const {data}=await sb.from("courses").select("*").eq("id",C.course.id).maybeSingle();if(data)C.course=data;render()}break}
    case "closeall":inlineConfirm(t,`Se guardará el cierre de esta semana para los ${C.teams.length} equipos con su canvas actual. ¿Continuar?`,"closeall2");break;
    case "closeall2":{t.disabled=true;const n=await run(sb.rpc("close_course_week",{cid:C.course.id}));if(n!==null){toast(`Semana cerrada para ${n} equipos`);loadCourseData()}break}
    case "exportclosures":exportClosures();break;
    case "randomize":inlineConfirm(t,`Se asignará al azar una herramienta a ${C.teams.filter(x=>!x.tool).length} equipos. Queda registrado y no se puede deshacer automáticamente. ¿Continuar?`,"randomize2");break;
    case "randomize2":{t.disabled=true;const r=await run(sb.rpc("randomize_course_tools",{cid:C.course.id}));if(r){toast(`Asignados ${r.assigned} equipos · BMC ${r.bmc} · Value Lab ${r.valuelab}`);loadCourseData()}break}
    case "saveconsent":{const txt=($("#consent-text")||{}).value||"";t.disabled=true;if(await run(sb.from("courses").update({consent_text:txt}).eq("id",C.course.id),"Texto guardado"))C.course.consent_text=txt;t.disabled=false;break}
    case "researchjson":exportResearch(t);break;
    case "consent":consentModal();break;
    case "admact":{const exp=($("#exp-"+id)||{}).value||null,note=($("#note-"+id)||{}).value;t.disabled=true;
      if(await run(sb.rpc("admin_set_teacher",{uid:id,p_status:"active",p_expires:exp,p_note:note==null?null:note}),exp?`Activado hasta el ${fmtDay(exp)}`:"Activado sin vencimiento")){ADM.found=null;openAdmin()}else t.disabled=false;break}
    case "admrej":inlineConfirm(t,"¿Rechazar la solicitud?","admrej2",id);break;
    case "admrej2":t.disabled=true;if(await run(sb.rpc("admin_set_teacher",{uid:id,p_status:"revoked",p_expires:null,p_note:"Solicitud rechazada"}),"Solicitud rechazada"))openAdmin();break;
    case "admrev":inlineConfirm(t,"¿Desactivar? Conserva sus cursos, pero no podrá crear nuevos.","admrev2",id);break;
    case "admrev2":t.disabled=true;if(await run(sb.rpc("admin_set_teacher",{uid:id,p_status:"revoked",p_expires:null,p_note:null}),"Profesor desactivado"))openAdmin();break;
    case "closuresel":T.closureSel=id;render();break;
    case "closuredel":inlineConfirm(t,"¿Eliminar este cierre? No se puede deshacer.","closuredel2",id);break;
    case "closuredel2":t.disabled=true;if(await run(sb.from("weekly_closures").delete().eq("id",id),"Cierre eliminado")){T.closureSel=null;refetch("closures")}break;
    case "hyp":hypModal(id);break;
    case "newiv":case "iv":ivModal(id);break;
    case "newlog":case "log":logModal(id);break;
    case "fbf":T.fbFilter=t.dataset.f;render();break;
    case "snapsel":T.snapSel=id;render();break;
    case "norender":render();break;
    case "fbres":{const f=T.feedback.find(x=>x.id===id);if(!f)return;t.disabled=true;
      if(await run(sb.from("feedback").update({resolved:!f.resolved,resolved_by:A.uid,resolved_at:now()}).eq("id",id),f.resolved?"Comentario reabierto":"Comentario resuelto"))refetch("feedback");else t.disabled=false;break}
    case "fbdel":inlineConfirm(t,"¿Eliminar comentario?","fbdel2",id);break;
    case "fbdel2":t.disabled=true;if(await run(sb.from("feedback").delete().eq("id",id),"Comentario eliminado"))refetch("feedback");break;
    case "snapdel":inlineConfirm(t,"¿Eliminar esta versión?","snapdel2",id);break;
    case "snapdel2":t.disabled=true;if(await run(sb.from("snapshots").delete().eq("id",id),"Versión eliminada")){T.snapSel=null;refetch("snaps")}break;
    case "rmmember":inlineConfirm(t,"¿Quitar del equipo?","rmmember2",id);break;
    case "rmmember2":t.disabled=true;if(await run(sb.from("team_members").delete().eq("team_id",T.id).eq("user_id",id),"Integrante quitado"))refetch("members");break;
    case "leave":inlineConfirm(t,"¿Seguro que quieres salir? Perderás acceso al trabajo del equipo.","leave2");break;
    case "leave2":t.disabled=true;if(await run(sb.from("team_members").delete().eq("team_id",T.id).eq("user_id",A.uid),"Saliste del equipo")){leaveTeam();go("#/")}break;
    case "regen":inlineConfirm(t,"Los códigos actuales dejarán de funcionar. ¿Continuar?","regen2");break;
    case "regen2":t.disabled=true;if(await run(sb.rpc("regenerate_codes",{tid:T.id}),"Códigos nuevos generados")){const {data}=await sb.from("teams").select("*,course:courses(*)").eq("id",T.id).maybeSingle();if(data)T.team=data;render()}break;
    case "delteam":inlineConfirm(t,"Se borrará el equipo y TODO su trabajo. ¿Eliminar?","delteam2");break;
    case "delteam2":{t.disabled=true;const cid=T.course.id;if(await run(sb.from("teams").delete().eq("id",T.id),"Equipo eliminado")){leaveTeam();go("#/curso/"+cid)}break}
    case "delcourse":inlineConfirm(t,"Se borrarán el curso, sus equipos y todo su trabajo. ¿Eliminar?","delcourse2");break;
    case "delcourse2":t.disabled=true;if(await run(sb.from("courses").delete().eq("id",C.course.id),"Curso eliminado"))go("#/");break;
    case "renamecourse":{const md=openModal(`<h2>Renombrar curso</h2><div class="field"><label for="rc-name">Nombre del curso</label><input id="rc-name" value="${esc(C.course.name)}" maxlength="100"></div><div class="acts"><button class="btn" data-close>Cancelar</button><button class="btn primary" data-save>Guardar</button></div>`);
      md.querySelector("[data-save]").onclick=async()=>{const name=md.querySelector("#rc-name").value.trim();if(!name)return;if(await run(sb.from("courses").update({name}).eq("id",C.course.id),"Curso renombrado")){C.course.name=name;closeModal();render()}};break}
    case "exportteam":exportTeam();break;
    case "exportcourse":exportCourse();break;
  }
});
document.addEventListener("input",e=>{if(e.target.id==="ivq"){T.q=e.target.value;render()}});
document.addEventListener("toggle",e=>{if(e.target.classList&&e.target.classList.contains("rpanel"))C.rOpen=e.target.open},true);
document.addEventListener("change",async e=>{
  if(e.target.classList.contains("toolsel")){const sel=e.target,tid=sel.dataset.team,team=C.teams.find(x=>x.id===tid);if(!team)return;const v=sel.value||null;
    const apply=async()=>{sel.disabled=true;if(await run(sb.from("teams").update({tool:v}).eq("id",tid),`${team.name}: ${v?TOOLS[v]:"sin herramienta"}`)){team.tool=v;loadCourseData()}else{sel.value=team.tool||""}sel.disabled=false};
    if(team.tool&&team.tool!==v){sel.value=team.tool;const md=openModal(`<h2>¿Cambiar la herramienta?</h2><p style="margin:0"><b>${esc(team.name)}</b> usa <b>${TOOLS[team.tool]}</b>. Si la cambias a <b>${v?TOOLS[v]:"sin asignar"}</b>, el equipo dejará de ver su trabajo actual (no se borra) y el cambio quedará en el historial de asignación.</p><div class="acts"><button class="btn" data-close>Cancelar</button><button class="btn primary" data-save>Cambiar</button></div>`);
      md.querySelector("[data-save]").onclick=()=>{closeModal();sel.value=v||"";apply()};return}

  if(e.target.id==="rctmode"||e.target.id==="research"){const f=e.target.id==="rctmode"?"rct_mode":"research_enabled",v=e.target.checked;e.target.disabled=true;
    if(await run(sb.from("courses").update({[f]:v}).eq("id",C.course.id),f==="rct_mode"?(v?"Modo RCT activado":"Modo RCT desactivado"):(v?"Se pedirá consentimiento":"Ya no se pedirá consentimiento"))){C.course[f]=v;render()}else e.target.checked=!v;e.target.disabled=false;return}

    if(await run(sb.from("courses").update({allow_team_creation:v}).eq("id",C.course.id),v?"Los estudiantes pueden crear equipos":"Solo tú puedes crear equipos"))C.course.allow_team_creation=v;
    else e.target.checked=!v;e.target.disabled=false}

document.addEventListener("submit",async e=>{
  const f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();
  const kind=f.dataset.form,btn=f.querySelector("[type=submit]");const val=s=>(f.querySelector(s)?.value||"").trim();
  const busy=v=>{if(btn)btn.disabled=v};
  if(kind==="login"){busy(true);const {error}=await sb.auth.signInWithPassword({email:val("#li-email"),password:f.querySelector("#li-pass").value});busy(false);
    if(error){A.authMsg={text:errText(error)};render()}else A.authMsg=null}
  else if(kind==="signup"){const name=val("#su-name");if(!name){A.authMsg={text:"Escribe tu nombre."};render();return}
    busy(true);const {data,error}=await sb.auth.signUp({email:val("#su-email"),password:f.querySelector("#su-pass").value,options:{data:{full_name:name},emailRedirectTo:location.origin+location.pathname}});busy(false);
    if(error){A.authMsg={text:errText(error)};render()}
    else if(!data.session){A.authMode="login";A.authMsg={ok:true,text:"¡Cuenta creada! Te enviamos un correo para confirmarla. Ábrelo, haz clic en el enlace y luego ingresa aquí."};render()}
    else{A.authMsg=null;A.pendingCode=val("#su-code")||null}}
  else if(kind==="forgot"){busy(true);const {error}=await sb.auth.resetPasswordForEmail(val("#fg-email"),{redirectTo:location.origin+location.pathname});busy(false);
    A.authMsg=error?{text:errText(error)}:{ok:true,text:"Si el correo está registrado, te llegará un enlace en unos minutos. Revisa también la carpeta de spam."};render()}
  else if(kind==="newpass"){busy(true);const {error}=await sb.auth.updateUser({password:f.querySelector("#np-pass").value});busy(false);
    if(error){A.authMsg={text:errText(error)};render()}else{A.recovering=false;A.authMsg=null;toast("Contraseña actualizada");history.replaceState(null,"",location.pathname+"#/");route()}}
  else if(kind==="quickteam"){const code=val("#qt-code"),name=val("#qt-name");if(!code){toast("Escribe el código del curso.");return}if(!name){toast("Escribe el nombre del equipo.");return}busy(true);
    const tid=await run(sb.rpc("create_course_team",{code,p_name:name}),"Equipo creado. Invita a tus compañeros con el código del equipo.");busy(false);
    if(tid){["qt-code","qt-name"].forEach(i=>{const el=document.getElementById(i);if(el)el.value=""});go("#/equipo/"+tid)}}
  else if(kind==="join"){const code=val("#join-code");if(!code)return;busy(true);await useCode(code);busy(false)}
  else if(kind==="accname"){const name=val("#acc-name"),email=val("#acc-email");if(!name){toast("Escribe tu nombre.");return}busy(true);
    let msg="Datos guardados",emailOk=null;
    if(email&&email!==((A.session&&A.session.user&&A.session.user.email)||"")){const {data,error}=await sb.auth.updateUser({email});
      if(error){busy(false);toast(errText(error));return}
      emailOk=data&&data.user&&data.user.email===email;msg=emailOk?"Datos y correo actualizados":"Te enviamos un correo para confirmar tu nueva dirección. Hasta confirmarla, sigue usando la anterior."}
    const upd={full_name:name};if(emailOk)upd.email=email;
    const r=await sb.from("profiles").update(upd).eq("id",A.uid);await sb.auth.updateUser({data:{full_name:name}});busy(false);
    if(r.error){toast(errText(r.error));return}
    A.name=name;names[A.uid]=name;const s2=await sb.auth.getSession();A.session=s2.data.session||A.session;toast(msg);render()}
  else if(kind==="accpass"){const p1=f.querySelector("#acc-pass").value,p2=f.querySelector("#acc-pass2").value;
    if(p1!==p2){toast("Las contraseñas no coinciden.");return}busy(true);const {error}=await sb.auth.updateUser({password:p1});busy(false);
    if(error)toast(/different/i.test(error.message||"")?"La nueva contraseña debe ser distinta de la actual.":errText(error));else{f.reset();toast("Contraseña cambiada")}}
  else if(kind==="createteam"){const name=val("#ct-name");if(!name){toast("Escribe el nombre del equipo.");return}busy(true);
    const tid=await run(sb.rpc("create_course_team",{code:J.code,p_name:name}),"Equipo creado. Invita a tus compañeros con el código del equipo.");busy(false);
    if(tid){J.preview=null;go("#/equipo/"+tid)}}
  else if(kind==="closeweek"){busy(true);const note=val("#cw-note");
    const ok=await run(sb.rpc("close_week",{tid:T.id,p_note:note}),"Semana cerrada");busy(false);
    if(ok){const el=document.getElementById("cw-note");if(el)el.value="";T.closureSel=null;await refetch("closures",true);const el2=document.getElementById("cw-note");if(el2)el2.value="";render()}}
  else if(kind==="reqteacher"){busy(true);const r=await run(sb.rpc("request_teacher_access",{p_note:val("#req-note")}),"Solicitud enviada");busy(false);if(r)openHome()}
  else if(kind==="admfind"){const em=val("#adm-email").toLowerCase();if(!em)return;busy(true);const {data}=await sb.from("profiles").select("id,full_name,email").ilike("email",em).limit(1);busy(false);ADM.found=(data&&data[0])||false;render()}
  else if(kind==="newcourse"){const name=val("#course-name");if(!name){toast("Escribe el nombre del curso.");return}busy(true);
    const d=await run(sb.from("courses").insert({name,owner_id:A.uid}).select("id").single(),"Curso creado");busy(false);
    if(d){const el=document.getElementById("course-name");if(el)el.value="";go("#/curso/"+d.id)}}
  else if(kind==="newteam"){const name=val("#team-name");if(!name){toast("Escribe el nombre del equipo.");return}busy(true);
    const d=await run(sb.from("teams").insert({name,course_id:C.course.id}).select("id").single(),"Equipo creado");busy(false);
    if(d){const el=document.getElementById("team-name");if(el)el.value="";loadCourseData()}}
  else if(kind==="addhyp"){const inp=f.querySelector("input");const text=inp.value.trim();const th=f.querySelector("[data-then]");
    if(!text){if(th&&th.value.trim())toast("Completa también la parte SI.");return}busy(true);
    const row={team_id:T.id,block:f.dataset.block,text};if(th)row.then_text=th.value.trim();
    if(await run(sb.from("hypotheses").insert(row))){const clr=()=>{[inp.id,th&&th.id].filter(Boolean).forEach(i=>{const el=document.getElementById(i);if(el)el.value=""});const el=document.getElementById(inp.id);if(el)el.focus()};clr();await refetch("hyps");clr()}busy(false)}
  else if(kind==="addfb"){const text=val("#fb-text");if(!text){toast("Escribe el comentario.");return}busy(true);
    if(await run(sb.from("feedback").insert({team_id:T.id,block:val("#fb-block"),text,created_by:A.uid}),"Comentario publicado")){const el=document.getElementById("fb-text");if(el)el.value="";await refetch("feedback");const el2=document.getElementById("fb-text");if(el2)el2.value=""}busy(false)}
  else if(kind==="addsnap"){const label=val("#snap-label")||("Versión del "+fmtDay(today()));busy(true);
    const items=T.hyps.map(h=>({id:h.id,block:h.block,text:hText(h),status:h.status}));
    const d=await run(sb.from("snapshots").insert({team_id:T.id,label,items}).select("id").single(),"Versión guardada");busy(false);
    if(d){T.snapSel=d.id;const el=document.getElementById("snap-label");if(el)el.value="";await refetch("snaps");const el2=document.getElementById("snap-label");if(el2)el2.value=""}}
  else if(kind==="teaminfo"){busy(true);const goal=parseInt(val("#ti-goal"))||10;
    if(await run(sb.rpc("update_team_info",{tid:T.id,p_name:val("#ti-name"),p_description:val("#ti-desc"),p_goal:goal}),"Datos del equipo guardados")){
      const {data}=await sb.from("teams").select("*,course:courses(*)").eq("id",T.id).maybeSingle();if(data)T.team=data;
      ["ti-name","ti-desc","ti-goal"].forEach(i=>{const el=document.getElementById(i);if(el)el.removeAttribute("data-keep")});render()}
    busy(false)}
});

boot();
</script>
</body>
</html>
