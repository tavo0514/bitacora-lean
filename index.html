<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bitácora Lean</title>
<meta name="description" content="Seguimiento de ideas de negocio: Business Model Canvas, entrevistas con clientes, bitácora semanal y retroalimentación de mentores.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231D5C7A'/%3E%3Cpath d='M7 9h7v6H7zM16 9h9v14h-9zM7 17h7v6H7z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --sunk:#E8ECEA; --line:#D3DAD7; --fg:#16201D; --muted:#5B6863;
  --accent:#1D5C7A; --accent-ink:#FFFFFF; --accent-soft:#DCEAF1;
  --ok:#2F7A4B; --ok-soft:#DCEFE2; --bad:#B23A3A; --bad-soft:#F6DEDC; --wait:#8A6A12; --wait-soft:#F4ECD3;
  --shadow:0 1px 2px rgba(20,40,35,.06),0 6px 20px rgba(20,40,35,.06);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1513; --surface:#17201D; --sunk:#111917; --line:#2A3632; --fg:#E4ECE8; --muted:#94A39D;
  --accent:#6BB3D6; --accent-ink:#0B1A22; --accent-soft:#16303D;
  --ok:#6CC08B; --ok-soft:#173022; --bad:#E58A85; --bad-soft:#3A1D1C; --wait:#D9B65A; --wait-soft:#33290F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1280px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.spacer{flex:1}

.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:max(14px,env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-bottom:12px}
.brand{font-family:var(--f-display);font-size:21px;font-weight:700;color:var(--fg);text-decoration:none;letter-spacing:-.01em}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0;font-weight:500}
.crumbs a{text-decoration:none;color:var(--muted)}
.crumbs a:hover{color:var(--fg)}
.crumbs .sep{color:var(--line)}
.crumbs b{overflow-wrap:anywhere}
.me{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap}
.mainnav{display:flex;gap:2px;flex-wrap:wrap}
.grid2.start{align-items:start}
.mainnav a{padding:6px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.mainnav a:hover{color:var(--fg);background:var(--sunk)}
.mainnav a.on{color:var(--accent);background:var(--accent-soft)}
a.melink{display:inline-flex;align-items:center;gap:8px;color:var(--fg);text-decoration:none}
.invite{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin-bottom:18px}
.invite div{display:grid;gap:2px;flex:1;min-width:220px}
.invite .code.big{background:var(--surface)}
@media (max-width:620px){.mainnav a{padding:5px 8px}}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11.5px;font-weight:600;flex:none;letter-spacing:.02em}
.people{display:flex}
.people .av{border:2px solid var(--bg);margin-left:-7px}
.people .av:first-child{margin-left:0}
.people .av.mentor{border-color:var(--wait)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:12px;margin-left:6px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;font-size:14px}

main{padding-top:22px}
.viewhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;margin-bottom:18px}
.viewhead h2{font-size:26px;font-weight:700}
.viewhead p{margin:4px 0 0;color:var(--muted);max-width:65ch}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:18px}
.banner.warn{background:var(--wait-soft);border-color:transparent}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:2px;background:currentColor}
.st-pending{background:var(--wait-soft);color:var(--wait)}
.st-valid{background:var(--ok-soft);color:var(--ok)}
.st-invalid{background:var(--bad-soft);color:var(--bad)}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted);white-space:nowrap}
.tag.mentor{border-color:var(--wait);color:var(--wait)}
.tag.teacher{border-color:var(--accent);color:var(--accent)}
.tag.pivot{background:var(--bad-soft);color:var(--bad);border-color:transparent;font-weight:600}

/* auth */
.authwrap{min-height:80vh;display:grid;place-items:center;padding-block:40px}
.authcard{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;display:grid;gap:14px;box-shadow:var(--shadow)}
.authcard h1{font-size:28px}
.authcard .lead{margin:-6px 0 4px;color:var(--muted)}
.authlinks{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between}
.msg{border-radius:8px;padding:9px 12px;font-size:14px}
.msg.err{background:var(--bad-soft);color:var(--bad)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}

/* home & course */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:6px;text-decoration:none;color:var(--fg)}
a.card:hover{border-color:var(--accent)}
.card h3{font-size:18px}
.section{margin-bottom:30px}
.section > h2{font-size:20px;margin-bottom:12px}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inline input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0;flex:1;max-width:340px}
.code{font-family:var(--f-mono);font-weight:500;letter-spacing:.12em;background:var(--sunk);border-radius:6px;padding:2px 8px;font-size:14px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:820px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
tr.tot td{font-weight:600;background:var(--sunk)}
td.hl{font-weight:600}
table.stats{min-width:980px}
table.stats td:first-child{white-space:nowrap}
.coursebar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.code.big{font-size:20px;padding:4px 12px}
.check{display:inline-flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0}
.mini div{background:var(--bg);border-radius:8px;padding:8px 10px}
.mini b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.mini span{font-size:12.5px;color:var(--muted)}
.chartlegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:6px}
.vlhdr{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin-bottom:4px}
.vlhdr .b{font-size:26px;color:var(--accent)}
.vlhdr .s{font-size:26px;color:var(--line)}
.vlhdr .t{font-size:20px;color:var(--muted)}
.vlintro{margin:0 0 16px;color:var(--muted);max-width:75ch}
.vlg{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1.15fr) 34px minmax(0,1fr);grid-template-areas:"st st st . sa" "b g1 p . a";align-items:start}
.vlsec{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em;margin:0 0 8px}
.vlsec.t{grid-area:st}.vlsec.a{grid-area:sa}
.vlbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:6px;position:relative}
.vlbox h3{font-size:17px;font-weight:600}
.vlbox .q{font-size:13px;color:var(--muted);margin:0 0 4px;line-height:1.45}
.vlkind{font-size:16px;color:var(--muted);font-family:var(--f-display)}
.vlnote{font-size:12px;font-style:italic;color:var(--muted);margin-top:-4px}
.vlpart{display:flex;flex-direction:column;gap:6px;min-width:0}
.vldown+.vlpart{padding-top:2px}
.vlpart .cnt{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.vlpart header{display:flex;align-items:baseline;gap:8px}
.vlb{grid-area:b}.vlp{grid-area:p}.vla{grid-area:a;display:flex;flex-direction:column;gap:14px;position:relative}
.vlgut{grid-area:g1;position:relative;align-self:stretch}
.vlgut::before{content:"";position:absolute;left:0;right:8px;top:24px;height:2.5px;background:var(--accent)}
.vlgut::after,.vla .vlbox::after{content:"";position:absolute;top:19px;border-left:9px solid var(--accent);border-top:6px solid transparent;border-bottom:6px solid transparent}
.vlgut::after{right:0}
.vla .vlbox::before{content:"";position:absolute;left:-34px;width:26px;top:24px;height:2.5px;background:var(--accent)}
.vla .vlbox::after{left:-9px}
.vla .vlbox:not(:last-child) .vlv{position:absolute;left:-34px;width:2.5px;top:24px;bottom:-38px;background:var(--accent)}
.vldown{display:flex;justify-content:center;color:var(--accent);height:22px}
.vldown svg{width:14px;height:22px}
.vlmob{display:none;justify-content:center}
.hyp.ift{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;align-items:baseline}
.hyp.ift .il{font-size:11.5px;font-style:italic;font-weight:600;color:var(--muted);letter-spacing:.04em}
.hyp.ift .meta,.hyp.ift .par{grid-column:1/-1}
.ifq{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;font-size:13px;color:var(--muted);margin-bottom:4px}
.ifq i{font-weight:600;font-size:12px;letter-spacing:.04em;color:var(--fg)}
.addf.two{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 8px;align-items:center}
.addf.two .il{font-size:11.5px;font-style:italic;font-weight:600;color:var(--muted)}
.addf.two button{grid-column:2;justify-self:end}
.rangehint{font-size:12px;color:var(--muted)}
.rangehint.ok{color:var(--ok)}
@media (max-width:980px){.vlg{grid-template-columns:minmax(0,1fr);grid-template-areas:"st" "b" "m1" "p" "m2" "sa" "a"}.vlgut{display:none}.vla .vlbox::before,.vla .vlbox::after,.vla .vlv{display:none}.vlmob{display:flex}.vlmob.m1{grid-area:m1}.vlmob.m2{grid-area:m2}.vlsec.a{margin-top:4px}}
.vl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.vlcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.vlhead{display:grid;gap:2px;padding:2px 2px 4px;border-bottom:2px solid var(--accent)}
.vlhead h3{font-size:18px}
.vlhead span{font-size:13px;color:var(--muted)}
.vl .blk{min-height:0}
.hyp .par{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.toolsel{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;font-size:13px;max-width:140px}
.rpanel{display:grid;gap:12px;margin-bottom:16px}
.rpanel .row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.rpanel textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;min-height:110px;resize:vertical}
.armcount{display:flex;flex-wrap:wrap;gap:8px}
.armcount span{background:var(--bg);border-radius:8px;padding:6px 10px;font-size:14px}
.armcount b{font-family:var(--f-display);font-size:18px;margin-right:4px;font-variant-numeric:tabular-nums}
@media (max-width:980px){.vl{grid-template-columns:minmax(0,1fr)}}
.chartlegend i.dash{background:repeating-linear-gradient(90deg,currentColor 0 5px,transparent 5px 8px)!important}
.chartlegend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--accent-soft)}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px}
.note ol{margin:6px 0 0;padding-left:20px}

/* canvas */
.canvas{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px;
  grid-template-areas:"kp kp ka ka vp vp cr cr cs cs" "kp kp kr kr vp vp ch ch cs cs" "cost cost cost cost cost rev rev rev rev rev"}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:150px}
.blk.big{min-height:300px}
.blk header{display:flex;align-items:baseline;gap:8px}
.blk h3{font-size:15px;font-weight:700}
.blk .q{font-size:12.5px;color:var(--muted);margin:-4px 0 2px}
.blk .cnt{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;gap:8px}
.fbdot{color:var(--wait)}
.hyps{display:flex;flex-direction:column;gap:6px}
.hyp{text-align:left;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 9px;display:flex;flex-direction:column;gap:5px}
.hyp:hover{border-color:var(--accent)}
.hyp .t{font-size:13.5px;line-height:1.4;overflow-wrap:anywhere}
.hyp .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.ev{font-family:var(--f-mono);font-size:11.5px}
.ev .a{color:var(--ok)} .ev .r{color:var(--bad)}
.addf{display:flex;gap:6px;margin-top:auto;padding-top:4px}
.addf input{flex:1;min-width:0;border:1px dashed var(--line);background:transparent;border-radius:8px;padding:6px 8px;font-size:13px}
.addf input:focus{border-style:solid;border-color:var(--accent);outline:none}
.empty-blk{font-size:12.5px;color:var(--muted);font-style:italic}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* summary */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi .v{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel h3{font-size:16px;margin-bottom:10px}
.chartbox{overflow-x:auto}
.prog{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 44px;gap:6px 10px;align-items:center;font-size:13px}
.stack{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--sunk)}
.stack span{display:block;height:100%}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.feed li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;font-size:13.5px}
.feed .when{font-size:12px;color:var(--muted)}

/* lists */
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.item.click{cursor:pointer}
.item.click:hover{border-color:var(--accent)}
.item-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.item-h strong{font-size:16px;font-family:var(--f-display)}
.item p{margin:6px 0 0;overflow-wrap:anywhere;white-space:pre-wrap}
.evrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.evchip{font-size:12px;border-radius:6px;padding:2px 7px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evchip.apoya{background:var(--ok-soft);color:var(--ok)}
.evchip.refuta{background:var(--bad-soft);color:var(--bad)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input[type=search],.toolbar input[type=text]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-width:0;flex:1;max-width:420px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.log{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px}
.log .wk{font-family:var(--f-mono);font-size:13px;color:var(--muted);padding-top:16px}
.log .cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:8px}
.log .cols p{margin:2px 0 0;font-size:14px}
.fb{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px}
.fb .av{width:32px;height:32px}
.fb.resolved{opacity:.65}
.compose{display:grid;gap:8px;margin-bottom:16px}
.compose .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.diff{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.diff ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}
.snaps{display:flex;flex-direction:column;gap:6px}
.snap{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.snap[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mlist{display:flex;flex-direction:column}
.mrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}

/* forms + modal */
.field{display:grid;gap:4px}
.field label{font-size:13px;font-weight:600}
.field input,.field select,.field textarea,.compose select,.compose textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.field textarea,.compose textarea{min-height:84px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,20,18,.45);display:flex;align-items:flex-start;justify-content:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:640px;padding:20px;display:grid;gap:14px}
.modal h2{font-size:21px}
.modal .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.modal .acts .left{margin-right:auto}
.statusbtns{display:flex;flex-wrap:wrap;gap:6px}
.statusbtns button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:13px}
.statusbtns button[aria-pressed="true"].pending{background:var(--wait-soft);color:var(--wait);border-color:var(--wait)}
.statusbtns button[aria-pressed="true"].valid{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.statusbtns button[aria-pressed="true"].invalid{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.evpick{border:1px solid var(--line);border-radius:10px;max-height:280px;overflow-y:auto}
.evpick .grp{padding:6px 10px;background:var(--sunk);font-size:12px;font-weight:600;color:var(--muted);position:sticky;top:0}
.evpick .opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 10px;border-top:1px solid var(--line);font-size:13.5px}
.evpick select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 6px;font-size:13px}
.empty{text-align:center;padding:44px 16px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
.empty h3{color:var(--fg);font-size:20px;margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:980px){
  .canvas{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"vp cs" "cr ch" "ka kr" "kp kp" "rev cost"}
  .blk.big{min-height:150px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .log .cols{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:620px){
  .canvas{grid-template-columns:minmax(0,1fr);grid-template-areas:"cs" "vp" "ch" "cr" "rev" "kr" "ka" "kp" "cost"}
  .log{grid-template-columns:minmax(0,1fr);gap:0}
  .log .wk{padding-top:0}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .diff{grid-template-columns:minmax(0,1fr)}
  .brand{font-size:19px}
  .me .nm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <div class="bar">
    <a class="brand" href="#/" id="brand">Bitácora Lean</a>
    <div class="crumbs" id="crumbs"></div>
    <div class="spacer"></div>
    <div class="people" id="people"></div>
    <div class="me" id="me"></div>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</div></div>
<main class="wrap" id="main"><div class="empty"><h3>Cargando…</h3></div></main>
<div id="modalroot"></div>
<div id="toastroot"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
"use strict";
/* ================= constantes ================= */
const BLOCKS=[
 {k:"kp",n:"Socios clave",q:"¿Qué aliados y proveedores necesitamos?",big:true},
 {k:"ka",n:"Actividades clave",q:"¿Qué tenemos que hacer muy bien?"},
 {k:"kr",n:"Recursos clave",q:"¿Qué activos son indispensables?"},
 {k:"vp",n:"Propuesta de valor",q:"¿Qué problema resolvemos y por qué nos elegirían?",big:true},
 {k:"cr",n:"Relación con clientes",q:"¿Cómo conseguimos, mantenemos y hacemos crecer clientes?"},
 {k:"ch",n:"Canales",q:"¿Cómo llegamos y entregamos valor?"},
 {k:"cs",n:"Segmentos de clientes",q:"¿Para quién creamos valor?",big:true},
 {k:"cost",n:"Estructura de costos",q:"¿Cuáles son los costos más importantes?"},
 {k:"rev",n:"Fuentes de ingreso",q:"¿Por qué y cuánto pagarían?"}
];
const VL_BLOCKS=[
 {k:"vl_orth",col:"b",n:"Creencias comunes",short:"Comunes",q:"¿Cuáles son las ortodoxias y creencias profundamente arraigadas en la industria sobre la tecnología, los gustos de los consumidores, la producción, la distribución, la gobernanza, etc.?",ph:"En la industria se cree que…",nostatus:true},
 {k:"vl_belief",col:"b",n:"Creencias contrarias o poco comunes",short:"Contrarias o poco comunes",q:"¿Qué crees tú que otros no creen? ¿Puedes imaginar creencias contrarias a las creencias comunes de la industria? ¿Cómo podrías pensar distinto sobre cómo organizarse, el futuro de la tecnología o la demanda de los consumidores?",ph:"Nosotros creemos que…",parent:["vl_orth"]},
 {k:"vl_problem",col:"p",n:"Problema central",q:"¿Qué problema central impide que se haga realidad tu creencia poco común?",ph:"El problema central es…",parent:["vl_belief"]},
 {k:"vl_sub",col:"p",n:"Subproblemas",q:"¿Qué tres a cinco subproblemas clave deben resolverse para resolver tu problema central?",ph:"Subproblema…",parent:["vl_problem"],range:[3,5]},
 {k:"vl_ifthen",col:"p",n:"Lógica causal",note:"(expresada como enunciados si-entonces o hipótesis)",q:"Intenta capturar tu hipótesis central en un enunciado si-entonces de la siguiente forma: si resolvemos estos subproblemas, entonces resolvemos este problema central, lo que nos permite introducir el siguiente valor.",ph:"resolvemos estos subproblemas…",ph2:"resolvemos este problema central, lo que nos permite introducir el siguiente valor…",parent:["vl_problem"],ifthen:true},
 {k:"vl_exp",col:"a",n:"Realizar experimentos",q:"¿Qué experimentos pondrían a prueba los principios centrales de la teoría? ¿Qué debemos demostrar que es cierto?",ph:"Experimento…",parent:["vl_ifthen","vl_sub"],st:["Pendiente","Apoya la teoría","Refuta la teoría"]},
 {k:"vl_res",col:"a",n:"Adquirir recursos",q:"¿Qué activos, tecnologías y habilidades revela la teoría como actualmente subvalorados?",ph:"Recurso…",parent:["vl_ifthen","vl_sub"],st:["Por conseguir","Conseguido","Descartado"]},
 {k:"vl_sol",col:"a",n:"Buscar soluciones",q:"¿Dónde podemos buscar soluciones a los subproblemas? ¿Quién ya ha resuelto problemas muy parecidos (quizás en otra industria)?",ph:"Buscaremos en…",parent:["vl_sub"],st:["Buscando","Encontrada","Descartada"]}];
const ALLB=BLOCKS.concat(VL_BLOCKS);
const BN=Object.fromEntries(ALLB.map(b=>[b.k,b.n]));
const TOOLS={bmc:"Business Model Canvas",valuelab:"Value Lab"};
const TOOLSHORT={bmc:"BMC",valuelab:"Value Lab"};
const blocksFor=tool=>tool==="valuelab"?VL_BLOCKS:BLOCKS;
const toolBlocks=()=>blocksFor(T.team&&T.team.tool);
const statusBlocks=()=>toolBlocks().filter(b=>!b.nostatus);
const blockOf=k=>ALLB.find(x=>x.k===k)||{};
const stOf=k=>{const b=blockOf(k);return b.st?{pending:b.st[0],valid:b.st[1],invalid:b.st[2]}:ST};
const hText=h=>h.block==="vl_ifthen"?`Si ${h.text}${h.then_text?`, entonces ${h.then_text}`:""}`:h.text;
const parentsOf=k=>{const p=blockOf(k).parent;return p?[].concat(p):[]};
const itemWord=()=>T.team&&T.team.tool==="valuelab"?"elemento":"hipótesis";
async function fetchAll(make){let out=[],from=0;for(;;){const {data,error}=await make().range(from,from+999);if(error)return{data:out,error};out=out.concat(data||[]);if(!data||data.length<1000)return{data:out,error:null};from+=1000}}
const ST={pending:"Por validar",valid:"Validada",invalid:"Invalidada"};
const TABS=[["resumen","Resumen"],["canvas","Canvas"],["entrevistas","Entrevistas"],["bitacora","Bitácora"],["mentores","Retroalimentación"],["versiones","Versiones"],["cierres","Cierres"],["equipo","Equipo"]];
const TABLES={hyps:"hypotheses",interviews:"interviews",logs:"logs",feedback:"feedback",snaps:"snapshots",closures:"weekly_closures",members:"team_members"};

const CFG=window.BITACORA_CONFIG||{};
const configured=CFG.supabaseUrl&&/^https:\/\//.test(CFG.supabaseUrl)&&CFG.supabaseKey&&!/PEGA_AQUI/.test(CFG.supabaseKey);
const START_RECOVERY=/type=recovery/.test(location.hash+location.search);
const sb=configured&&window.supabase?window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey,{auth:{flowType:"implicit",persistSession:true,detectSessionInUrl:true}}):null;
if(CFG.appName){document.title=CFG.appName;document.getElementById("brand").textContent=CFG.appName}

/* ================= estado ================= */
const A={session:null,uid:null,name:"",recovering:false,authMode:"login",authMsg:null,autoOpened:false};
const H={teams:[],courses:[],loaded:false,canCreate:true,access:null,isAdmin:false,legacy:false};
const ADM={rows:[],courseCount:{},loaded:false,found:null};
const C={course:null,teams:[],stats:{},loaded:false};
const T={id:null,team:null,course:null,role:null,isTeacher:false,members:[],hyps:[],interviews:[],logs:[],feedback:[],snaps:[],closures:[],closuresErr:false,closureSel:null,tab:"resumen",fbFilter:"open",snapSel:null,q:"",loaded:false};
const J={code:null,preview:null};
let view="loading",channel=null;
const names={};

/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now=()=>new Date().toISOString();
const keyOf=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>keyOf(new Date());
const parseDay=s=>{const [y,m,d]=String(s||"").slice(0,10).split("-").map(Number);return y?new Date(y,m-1,d):new Date()};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fmtDay=s=>{const d=/^\d{4}-\d{2}-\d{2}$/.test(String(s))?parseDay(s):new Date(s);return d.getDate()+" "+MES[d.getMonth()]+" "+d.getFullYear()};
const fmtShort=d=>d.getDate()+" "+MES[d.getMonth()];
const ago=iso=>{if(!iso)return"";const m=(Date.now()-new Date(iso))/6e4;if(m<1)return"recién";if(m<60)return"hace "+Math.round(m)+" min";const h=m/60;if(h<24)return"hace "+Math.round(h)+" h";const d=h/24;if(d<30)return"hace "+Math.round(d)+" d";return fmtDay(iso)};
const trim=(s,n)=>{s=String(s||"");return s.length>n?s.slice(0,n-1)+"…":s};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const thisWeek=()=>keyOf(mondayOf(new Date()));

function toast(msg){const r=$("#toastroot");r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML="",3200)}
function errText(e){
  const m=String((e&&(e.message||e.error_description))||e||"");
  if(/row-level security|permission denied|Sin permiso/i.test(m))return"No tienes permiso para hacer esto.";
  if(/Invalid login credentials/i.test(m))return"Correo o contraseña incorrectos.";
  if(/already registered|already exists/i.test(m))return"Ya existe una cuenta con ese correo. Usa “Ingresar”.";
  if(/Email not confirmed/i.test(m))return"Primero confirma tu correo: revisa tu bandeja de entrada (y la carpeta de spam).";
  if(/Password should be at least/i.test(m))return"La contraseña debe tener al menos 6 caracteres.";
  if(/rate limit|too many/i.test(m))return"Demasiados intentos seguidos. Espera unos minutos e inténtalo otra vez.";
  if(/Failed to fetch|NetworkError|network/i.test(m))return"Sin conexión con el servidor. Revisa tu internet.";
  if(/Código no válido/.test(m))return"Ese código no existe. Revisa que esté bien escrito.";
  if(/Could not find the function|schema cache|does not exist/i.test(m))return"La base de datos no está actualizada: en Supabase, ejecuta de nuevo el archivo schema.sql (ver la guía).";
  if(/JWT|session/i.test(m))return"Tu sesión expiró. Vuelve a ingresar.";
  return m||"Algo salió mal. Inténtalo de nuevo.";
}
async function run(promise,okMsg){
  try{const {data,error}=await promise;if(error){console.warn(error);toast(errText(error));return null}if(okMsg)toast(okMsg);return data??true}
  catch(e){console.warn(e);toast(errText(e));return null}
}
function initials(n){n=String(n||"").trim();if(!n)return"?";const p=n.split(/\s+/);return((p[0][0]||"")+(p.length>1?p[p.length-1][0]:"")).toUpperCase()}
function hue(id){let h=0;for(const c of String(id||""))h=(h*31+c.charCodeAt(0))%360;return h}
function av(id,cls=""){const n=nameRaw(id);return `<span class="av ${cls}" style="background:hsl(${hue(id)} 42% 42%)" title="${esc(n||"Persona")}" aria-hidden="true">${esc(initials(n))}</span>`}
const nameRaw=id=>names[id]||"";
const nameOf=id=>id&&id===A.uid?"Tú":(names[id]||"Alguien");
const realName=id=>(id&&id===A.uid?A.name:names[id])||"Sin nombre";
async function loadNames(ids){
  const need=[...new Set(ids.filter(id=>id&&!(id in names)))];if(!need.length)return;
  need.forEach(id=>names[id]="");
  const {data}=await sb.from("profiles").select("id,full_name").in("id",need);
  (data||[]).forEach(p=>names[p.id]=p.full_name||"");
}
function download(filename,text,type){
  const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
}
const slug=s=>(s||"archivo").toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"archivo";
const csvCell=v=>{v=String(v??"");return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};

/* ================= render con estado preservado ================= */
function keepState(){
  const a=document.activeElement;const st={vals:{},focus:a&&a.id?a.id:null,sel:null};
  document.querySelectorAll("#main [data-keep]").forEach(el=>{if(el.id)st.vals[el.id]=el.value});
  if(a&&a.id&&"selectionStart" in a){try{st.sel=[a.selectionStart,a.selectionEnd]}catch(e){}}
  return st}
function restoreState(st){
  for(const[id,v] of Object.entries(st.vals)){const el=document.getElementById(id);if(el)el.value=v}
  if(st.focus){const el=document.getElementById(st.focus);if(el&&el.closest("#main")){el.focus();if(st.sel)try{el.setSelectionRange(st.sel[0],st.sel[1])}catch(e){}}}
}
let rq=false;
function render(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;doRender()})}
function doRender(){
  const st=keepState();
  renderTop();
  const m=$("#main");
  const fn={account:vAccount,admin:vAdmin,joincourse:vJoinCourse,setup:vSetup,auth:vAuth,recovery:vRecovery,home:vHome,course:vCourse,team:vTeam,loading:()=>`<div class="empty"><h3>Cargando…</h3></div>`,notfound:vNotFound}[view];
  m.innerHTML=fn();
  restoreState(st);
}
function renderTop(){
  const logged=!!A.uid&&!["auth","setup","recovery"].includes(view);
  const on=v=>view===v?"on":"";
  $("#me").innerHTML=logged?`<nav class="mainnav" aria-label="Navegación"><a href="#/" class="${on("home")}">Inicio</a>${A.isAdmin?`<a href="#/admin" class="${on("admin")}">Administración</a>`:""}<a href="#/cuenta" class="${on("account")}">Mi cuenta</a></nav><a class="melink" href="#/cuenta" title="Mi cuenta">${av(A.uid)}<span class="nm">${esc(A.name||"")}</span></a><button class="btn sm ghost" data-act="logout">Salir</button>`:"";
  let cr="";
  if(view==="course"&&C.course)cr=`<span class="sep">/</span><b>${esc(C.course.name)}</b>`;
  if(view==="team"&&T.team)cr=(T.isTeacher?`<span class="sep">/</span><a href="#/curso/${esc(T.course.id)}">${esc(T.course.name)}</a>`:(T.course?`<span class="sep">/</span><span class="muted">${esc(T.course.name)}</span>`:""))+`<span class="sep">/</span><b>${esc(T.team.name)}</b>`;
  $("#crumbs").innerHTML=cr;
  if(view==="team"&&T.team){
    const mem=T.members.slice().sort((a,b)=>a.role===b.role?0:a.role==="mentor"?1:-1);
    $("#people").innerHTML=mem.slice(0,8).map(x=>av(x.user_id,x.role==="mentor"?"mentor":"")).join("")+(mem.length>8?`<span class="mono muted" style="margin-left:6px">+${mem.length-8}</span>`:"");
    const counts={canvas:T.hyps.length,entrevistas:T.interviews.length,bitacora:T.logs.length,mentores:T.feedback.filter(f=>!f.resolved).length,versiones:T.snaps.length,cierres:T.closures.length,equipo:T.members.length};
    $("#tabs").innerHTML=TABS.map(([k,n])=>`<button class="tab" role="tab" aria-selected="${T.tab===k}" data-act="tab" data-tab="${k}">${k==="canvas"?(T.team.tool==="valuelab"?"Value Lab":T.team.tool==="bmc"?"Canvas":"Herramienta"):n}${counts[k]?`<span class="n">${counts[k]}</span>`:""}</button>`).join("");
  }else{$("#people").innerHTML="";$("#tabs").innerHTML=""}
}

/* ================= navegación ================= */
function parseHash(){const p=(location.hash||"#/").replace(/^#\/?/,"").split("/");return p}
async function route(){
  if(!sb){view="setup";render();return}
  if(A.recovering){view="recovery";render();return}
  if(!A.uid){leaveTeam();view="auth";render();return}
  const p=parseHash();
  if(p[0]==="equipo"&&p[1]){
    const tab=TABS.some(t=>t[0]===p[2])?p[2]:"resumen";
    if(T.id===p[1]&&view==="team"){T.tab=tab;render();return}
    T.tab=tab;await openTeam(p[1]);return}
  leaveTeam();
  if(p[0]==="admin"){await openAdmin();return}
  if(p[0]==="cuenta"){view="account";render();return}
  if(p[0]==="unirse"){if(!J.preview){const c=lsGet("bl-course-code");if(c){const pv=await sb.rpc("course_preview",{code:c});if(!pv.error&&pv.data){J.code=c;J.preview=pv.data}}}
    if(J.preview){view="joincourse";render();return}}
  if(p[0]==="curso"&&p[1]){await openCourse(p[1]);return}
  await openHome();
}
window.addEventListener("hashchange",route);
const go=h=>{if(location.hash===h)route();else location.hash=h};

/* ================= sesión ================= */
async function setSession(session){
  const uid=session?.user?.id||null;const changed=uid!==A.uid;
  A.session=session;A.uid=uid;
  if(uid&&changed){
    A.name=session.user.user_metadata?.full_name||"";
    const {data}=await sb.from("profiles").select("full_name").eq("id",uid).maybeSingle();
    if(data&&data.full_name)A.name=data.full_name;names[uid]=A.name;
    const ad=await sb.rpc("is_app_admin");A.isAdmin=!ad.error&&!!ad.data;
  }
  return changed;
}
async function boot(){
  if(!sb){route();return}
  if(START_RECOVERY)A.recovering=true;
  let booted=false;
  // Importante: no llamar a Supabase directamente dentro de este aviso (se difiere con setTimeout)
  sb.auth.onAuthStateChange((event,session)=>{
    setTimeout(async()=>{
      if(event==="PASSWORD_RECOVERY"){A.recovering=true;await setSession(session);route();return}
      if(event==="TOKEN_REFRESHED"){A.session=session;return}
      if(!booted)return;
      const changed=await setSession(session);
      if(changed){H.loaded=false;A.autoOpened=false;if(!session)leaveTeam();route()}
    },0);
  });
  const {data}=await sb.auth.getSession();
  await setSession(data.session);
  booted=true;
  route();
}

/* ================= pantallas: configuración y acceso ================= */
function vSetup(){
  return `<div class="authwrap"><div class="authcard"><h1>Falta un paso de configuración</h1>
  <p>La página todavía no sabe a qué base de datos conectarse. Abre el archivo <b>config.js</b> en GitHub y pega la <b>URL del proyecto</b> y la <b>publishable key</b> de Supabase, tal como explica la guía.</p>
  ${!window.supabase?`<div class="msg err">Además, no se pudo cargar la librería de Supabase. Revisa tu conexión a internet.</div>`:""}</div></div>`;
}
function vAuth(){
  const m=A.authMode,msg=A.authMsg;
  const msgHtml=msg?`<div class="msg ${msg.ok?"ok":"err"}" role="alert">${esc(msg.text)}</div>`:"";
  if(m==="signup")return `<div class="authwrap"><form class="authcard" data-form="signup"><h1>Crear cuenta</h1><p class="lead">Con tu cuenta podrás unirte al equipo que te indique tu profesor/a.</p>${msgHtml}
    <div class="field"><label for="su-name">Nombre y apellido</label><input id="su-name" data-keep autocomplete="name" required maxlength="80"></div>

async function loadCourseData(){
  const id=C.course.id;
  const {data:teams}=await sb.from("teams").select("*").eq("course_id",id).order("created_at");
  C.teams=teams||[];const ids=C.teams.map(t=>t.id);
  const st={};C.teams.forEach(t=>st[t.id]={est:0,men:0,iv:0,ivw:0,hv:0,hi:0,ht:0,lastLog:null,piv:0,fb:0,ids:[]});
  if(ids.length){
    const [m,h,i,l,f,cl]=await Promise.all([
      sb.from("team_members").select("team_id,role,user_id").in("team_id",ids),
      fetchAll(()=>sb.from("hypotheses").select("team_id,status,block").in("team_id",ids).order("id")),
      fetchAll(()=>sb.from("interviews").select("team_id,interview_date").in("team_id",ids).order("id")),
      sb.from("logs").select("team_id,week,pivot").in("team_id",ids).limit(10000),
      sb.from("feedback").select("team_id,resolved").in("team_id",ids).limit(10000),
      sb.from("weekly_closures").select("team_id,week,stats,note,closed_by,auto,created_at,updated_at").in("team_id",ids).order("week",{ascending:false}).limit(10000)]);
    C.closuresErr=!!cl.error;C.closures=cl.data||[];
    if("rct_mode" in C.course){const [al,co]=await Promise.all([sb.from("assignment_log").select("*").eq("course_id",id).order("changed_at",{ascending:false}).limit(1000),sb.from("research_consents").select("user_id,consent").eq("course_id",id)]);C.assign=al.data||[];C.consents=co.data||[]}
    C.closures.forEach(x=>{const s=st[x.team_id];if(s&&!s.lastClose)s.lastClose=x});
    const wk=thisWeek();
    (m.data||[]).forEach(x=>{const s=st[x.team_id];if(x.role==="mentor")s.men++;else{s.est++;(s.sids=s.sids||[]).push(x.user_id)}s.ids.push(x.user_id)});
    (h.data||[]).forEach(x=>{const s=st[x.team_id];const tm=C.teams.find(t=>t.id===x.team_id);if(tm&&!blocksFor(tm.tool).some(b=>b.k===x.block&&!b.nostatus))return;s.ht++;if(x.status==="valid")s.hv++;if(x.status==="invalid")s.hi++});
    (i.data||[]).forEach(x=>{const s=st[x.team_id];s.iv++;if(keyOf(mondayOf(parseDay(x.interview_date)))===wk)s.ivw++});
    (l.data||[]).forEach(x=>{const s=st[x.team_id];if(!s.lastLog||x.week>s.lastLog)s.lastLog=x.week;if(x.pivot)s.piv++});
    (f.data||[]).forEach(x=>{if(!x.resolved)st[x.team_id].fb++});
    await loadNames((m.data||[]).map(x=>x.user_id).concat(C.closures.map(x=>x.closed_by).filter(Boolean)));
  }else{C.closures=[]}
  C.stats=st;C.loaded=true;render();
}
function vCourse(){
  if(!C.loaded)return`<div class="empty"><h3>Cargando el curso…</h3></div>`;
  const wk=thisWeek();
  const rows=C.teams.map(t=>{const s=C.stats[t.id];const flags=[];
    if(s.est===0)flags.push("Sin estudiantes");
    if(s.ivw<t.goal)flags.push(`${s.ivw}/${t.goal} entrevistas esta semana`);
    if(!s.lastLog||s.lastLog<wk)flags.push("Sin bitácora esta semana");
    if(!C.closuresErr&&(!s.lastClose||s.lastClose.week<wk))flags.push("Sin cierre esta semana");
    return `<tr class="click" data-act="openteam" data-id="${esc(t.id)}"><td><b>${esc(t.name)}</b>${t.description?`<div class="muted" style="font-size:12.5px">${esc(trim(t.description,70))}</div>`:""}</td>
    ${"rct_mode" in C.course?`<td><select class="toolsel" data-team="${esc(t.id)}" aria-label="Herramienta de ${esc(t.name)}"><option value="" ${!t.tool?"selected":""}>Sin asignar</option><option value="bmc" ${t.tool==="bmc"?"selected":""}>BMC</option><option value="valuelab" ${t.tool==="valuelab"?"selected":""}>Value Lab</option></select></td>`:""}
    <td class="num">${s.est} <span class="muted">+${s.men}m</span></td>
    <td class="num">${s.ivw} <span class="muted">/ ${s.iv}</span></td>
    <td class="num"><span style="color:var(--ok)">${s.hv}</span> · <span style="color:var(--bad)">${s.hi}</span> · ${s.ht}</td>
    <td>${s.lastLog?fmtDay(s.lastLog):"—"}${s.piv?` <span class="tag pivot">${s.piv} pivote${s.piv>1?"s":""}</span>`:""}</td>
    <td class="num">${s.fb}</td>
    <td>${flags.length?`<span class="chip st-pending" title="${esc(flags.join(" · "))}">${esc(flags[0])}${flags.length>1?" +"+(flags.length-1):""}</span>`:`<span class="chip st-valid">Al día</span>`}</td>
    <td>${s.lastClose?`${fmtDay(s.lastClose.week)}<div class="muted" style="font-size:12.5px">${(s.lastClose.stats.totals||{}).changes||0} cambios${s.lastClose.auto?" · automático":""}</div>`:"—"}</td>
    <td><span class="code" title="Código para mentores">${esc(t.mentor_code)}</span></td><td><span class="btn sm primary">Abrir →</span></td></tr>`}).join("");
  return `<div class="viewhead"><div><h2>${esc(C.course.name)}</h2><p>Panel del curso. Haz clic en un equipo para ver su trabajo y dejar comentarios.</p></div><span class="spacer"></span>
    ${C.teams.length?`<button class="btn" data-act="exportcourse">Descargar resumen (CSV)</button>`:""}${C.closures.length?`<button class="btn" data-act="exportclosures">Descargar cierres (CSV)</button>`:""}<button class="btn" data-act="renamecourse">Renombrar</button></div>
  ${C.course.join_code!==undefined?`<div class="coursebar"><span class="label">Código del curso</span><span class="code big">${esc(C.course.join_code)}</span><button class="btn sm" data-act="copycode" data-code="${esc(C.course.join_code)}">Copiar</button><span><button class="btn sm ghost" data-act="regencourse">Generar código nuevo</button></span><span class="spacer"></span><label class="check"><input type="checkbox" id="allowcreate" ${C.course.allow_team_creation?"checked":""}> Los estudiantes pueden crear sus propios equipos</label></div>`
  :`<div class="banner warn">Para usar el código del curso y los cierres semanales, ejecuta de nuevo el archivo <b>schema.sql</b> en Supabase (ver la guía).</div>`}
  ${researchPanel()}
  ${C.teams.length&&!C.closuresErr?`<div class="toolbar"><span class="muted" style="font-size:14px">Semana del ${fmtDay(wk)}: ${C.teams.filter(t=>C.stats[t.id].lastClose&&C.stats[t.id].lastClose.week===wk).length} de ${C.teams.length} equipos cerrados.</span><span><button class="btn sm" data-act="closeall">Cerrar la semana de todos los equipos</button></span></div>`:""}
  <form class="toolbar" data-form="newteam"><input type="text" id="team-name" data-keep placeholder="Nombre del nuevo equipo" maxlength="80" aria-label="Nombre del nuevo equipo"><button class="btn primary" type="submit">Crear equipo</button></form>
  ${C.teams.length?`<h3 style="font-size:18px;margin:0 0 10px">Equipos del curso (${C.teams.length})</h3><div class="tablewrap"><table><thead><tr><th>Equipo</th>${"rct_mode" in C.course?"<th>Herramienta</th>":""}<th>Integrantes</th><th>Entrevistas<br>semana / total</th><th>Hipótesis<br>✓ · ✗ · total</th><th>Última bitácora</th><th>Comentarios<br>abiertos</th><th>Estado</th><th>Último<br>cierre</th><th>Código<br>mentores</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="note" style="margin-top:16px"><b>Cómo invitar:</b><ol><li>Comparte el <b>código del curso</b> con tus estudiantes.</li><li>Cada estudiante crea su cuenta en esta página, escribe el código y elige su equipo o crea uno nuevo (si lo permites arriba). Solo pueden estar en un equipo por curso.</li><li>Los mentores usan el <b>código de mentores</b> de cada equipo: pueden leer todo y comentar, pero no editar el canvas. Los estudiantes también ven ese código para invitar a su mentor.</li></ol></div>`
  :`<div class="empty"><h3>Este curso aún no tiene equipos</h3><p>Comparte el código del curso para que los estudiantes creen o elijan su equipo, o crea uno tú escribiendo su nombre arriba.</p></div>`}
  <div style="margin-top:28px;display:flex;justify-content:flex-end" id="delcourse"><button class="btn sm ghost" data-act="delcourse">Eliminar este curso</button></div>`;
}

/* ================= equipo ================= */
let poll=null;
function leaveTeam(){if(channel){sb.removeChannel(channel);channel=null}clearInterval(poll);poll=null;T.id=null;T.team=null;T.loaded=false}
function refreshAll(){if(view==="team"&&T.id&&T.loaded)Object.keys(TABLES).forEach(k=>refetch(k))}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refreshAll()});
async function openTeam(id){
  leaveTeam();view="team";T.id=id;T.snapSel=null;T.q="";render();
  const {data:team,error}=await sb.from("teams").select("*,course:courses(*)").eq("id",id).maybeSingle();
  if(T.id!==id)return;
  if(error||!team){view="notfound";render();return}
  T.team=team;T.course=team.course;T.isTeacher=team.course&&team.course.owner_id===A.uid;
  await Promise.all(Object.keys(TABLES).map(k=>refetch(k,true)));
  if(T.id!==id)return;
  T.loaded=true;lsSet("bl-team",id);
  checkConsent();
  channel=sb.channel("team-"+id);
  Object.entries(TABLES).forEach(([k,tbl])=>channel.on("postgres_changes",{event:"*",schema:"public",table:tbl,filter:"team_id=eq."+id},()=>scheduleRefetch(k)));
  channel.subscribe();
  poll=setInterval(()=>{if(document.visibilityState==="visible")refreshAll()},60000);
  render();
}
const pending={};
function scheduleRefetch(k){clearTimeout(pending[k]);pending[k]=setTimeout(()=>refetch(k),250)}
async function refetch(k,silent){
  const id=T.id;if(!id)return;
  const order={hyps:"created_at",interviews:"interview_date",logs:"week",feedback:"created_at",snaps:"created_at",closures:"week",members:"joined_at"}[k];
  const {data,error}=await sb.from(TABLES[k]).select("*").eq("team_id",id).order(order,{ascending:k==="hyps"||k==="members"}).limit(5000);
  if(T.id!==id)return;
  if(k==="closures")T.closuresErr=!!error;
  if(error){console.warn(k,error);if(!silent)render();return}
  T[k]=data||[];
  if(k==="members"){
    T.role=(T.members.find(m=>m.user_id===A.uid)||{}).role||null;
    if(!T.role&&!T.isTeacher&&T.loaded){toast("Ya no perteneces a este equipo.");go("#/");return}
  }
  const ids=[];T.members.forEach(m=>ids.push(m.user_id));["hyps","interviews","logs","feedback","snaps","closures"].forEach(c=>T[c].forEach(x=>{if(x.created_by)ids.push(x.created_by);if(x.updated_by)ids.push(x.updated_by);if(x.closed_by)ids.push(x.closed_by)}));
  if(T.course)ids.push(T.course.owner_id);
  await loadNames(ids);
  if(!silent)render();
}
const canEdit=()=>T.isTeacher||T.role==="estudiante";
const roleOf=id=>T.course&&id===T.course.owner_id?"profesor":(T.members.find(m=>m.user_id===id)||{}).role;
function roleTag(id){const r=roleOf(id);return r==="profesor"?`<span class="tag teacher">Profesor/a</span>`:r==="mentor"?`<span class="tag mentor">Mentor</span>`:r?`<span class="tag">Estudiante</span>`:""}
function evidence(){const ev={};for(const iv of T.interviews){for(const [hid,v] of Object.entries(iv.evidence||{})){ev[hid]=ev[hid]||{a:0,r:0};if(v==="apoya")ev[hid].a++;else if(v==="refuta")ev[hid].r++}}return ev}
const hypsOf=k=>T.hyps.filter(h=>h.block===k);

function vTeam(){
  if(!T.loaded)return`<div class="empty"><h3>Cargando el equipo…</h3></div>`;
  let pre="";
  if(T.role==="mentor")pre=`<div class="banner"><span>Participas como <b>mentor</b>: puedes ver todo y dejar comentarios en <b>Retroalimentación</b>. Solo el equipo edita el canvas.</span></div>`;
  else if(T.isTeacher)pre=`<div class="banner"><span>Estás viendo este equipo como <b>profesor/a</b>. Puedes revisar, comentar y editar.</span></div>`;
  const v={resumen:vResumen,canvas:vCanvas,entrevistas:vEntrevistas,bitacora:vBitacora,mentores:vMentores,versiones:vVersiones,cierres:vCierres,equipo:vEquipo}[T.tab];
  return pre+v();
}

/* --- Resumen --- */
function vResumen(){
  const t=T.team,goal=t.goal||10,wk=thisWeek();
  const byWk={};T.interviews.forEach(iv=>{const k=keyOf(mondayOf(parseDay(iv.interview_date)));byWk[k]=(byWk[k]||0)+1});
  const v=T.hyps.filter(h=>h.status==="valid").length,inv=T.hyps.filter(h=>h.status==="invalid").length,pen=T.hyps.length-v-inv;
  const openFb=T.feedback.filter(f=>!f.resolved).length,pivots=T.logs.filter(l=>l.pivot).length;
  const invite=T.role==="estudiante"?`<div class="invite"><div><b>Invita a tus compañeros de equipo</b><span class="muted" style="font-size:13.5px">Envíales este código. Al crear su cuenta lo escriben en “Unirme con un código” y quedan en este equipo.</span></div><span class="code big">${esc(t.student_code)}</span><button class="btn sm" data-act="copycode" data-code="${esc(t.student_code)}">Copiar código</button><button class="btn sm primary" data-act="copyinvite" data-code="${esc(t.student_code)}">Copiar invitación</button></div>`:"";
  return invite+`<div class="viewhead"><div><h2>${esc(t.name)}</h2>${T.team.tool?`<span class="tag" style="margin-top:6px">${TOOLS[T.team.tool]}</span>`:""}${t.description?`<p>${esc(t.description)}</p>`:canEdit()?`<p>Agrega una descripción de la idea en la pestaña <b>Equipo</b>.</p>`:""}</div></div>
  <div class="kpis">
    <div class="kpi"><div class="label">Entrevistas</div><div class="v">${T.interviews.length}</div><div class="s"><span class="mono">${byWk[wk]||0}/${goal}</span> esta semana</div></div>
    <div class="kpi"><div class="label">Hipótesis validadas</div><div class="v" style="color:var(--ok)">${v}</div><div class="s">de ${T.hyps.length} en el canvas</div></div>
    <div class="kpi"><div class="label">Invalidadas</div><div class="v" style="color:var(--bad)">${inv}</div><div class="s">${pen} por validar</div></div>
    <div class="kpi"><div class="label">Comentarios abiertos</div><div class="v">${openFb}</div><div class="s">${pivots} pivote${pivots===1?"":"s"} en la bitácora</div></div>
  </div>
  <div class="grid2">
    <div class="panel"><h3>Entrevistas por semana</h3><div class="chartbox">${weekChart(byWk,goal)}</div></div>
    <div class="panel"><h3>Validación por bloque</h3><div class="prog">${statusBlocks().map(b=>{const hs=hypsOf(b.k);const n=hs.length||1;const a=hs.filter(h=>h.status==="valid").length,r=hs.filter(h=>h.status==="invalid").length;
      return `<span>${b.n}</span><div class="stack" title="${a} validadas, ${r} invalidadas, ${hs.length-a-r} por validar"><span style="width:${a/n*100}%;background:var(--ok)"></span><span style="width:${r/n*100}%;background:var(--bad)"></span><span style="width:${hs.length?(hs.length-a-r)/n*100:0}%;background:var(--wait);opacity:.55"></span></div><span class="mono muted">${a}/${hs.length}</span>`}).join("")}</div>
      <div class="legend" style="margin-top:12px"><span class="chip st-valid">Validada</span><span class="chip st-invalid">Invalidada</span><span class="chip st-pending">Por validar</span></div></div>
  </div>
  <div class="panel" style="margin-top:14px"><h3>Actividad reciente</h3>${feed()}</div>`;
}
function weekChart(byWk,goal){
  const weeks=[];const m=mondayOf(new Date());for(let i=9;i>=0;i--){const d=new Date(m);d.setDate(d.getDate()-7*i);weeks.push(d)}
  const vals=weeks.map(d=>byWk[keyOf(d)]||0);
  const max=Math.max(goal,...vals,1);const top=Math.ceil(max/5)*5||5;
  const W=600,H=220,L=34,R=10,Tp=14,B=30,cw=(W-L-R)/weeks.length,y=v=>Tp+(H-Tp-B)*(1-v/top);
  let g="";for(let t=0;t<=top;t+=top/5){g+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${Math.round(t)}</text>`}
  const bars=vals.map((v,i)=>{const x=L+i*cw+cw*.18,bw=cw*.64,last=i===vals.length-1;return `<rect x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(0,y(0)-y(v))}" rx="2" fill="var(--accent)" opacity="${last?1:.6}"><title>Semana del ${fmtShort(weeks[i])}: ${v}</title></rect>${v?`<text x="${x+bw/2}" y="${y(v)-4}" text-anchor="middle" font-size="11" fill="var(--fg)" font-family="IBM Plex Mono,monospace">${v}</text>`:""}<text x="${x+bw/2}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${fmtShort(weeks[i])}</text>`}).join("");
  const gl=`<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--wait)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-R}" y="${y(goal)-5}" text-anchor="end" font-size="11" fill="var(--wait)">meta ${goal}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img" aria-label="Entrevistas por semana, últimas 10 semanas">${g}${bars}${gl}</svg>`;
}
function feed(){
  const it=[];
  T.hyps.forEach(h=>it.push({t:h.updated_at||h.created_at,by:h.updated_by||h.created_by,txt:`${h.updated_at?"actualizó":"agregó"} una hipótesis en <b>${esc(BN[h.block])}</b>: “${esc(trim(h.text,80))}”`}));
  T.interviews.forEach(i=>it.push({t:i.created_at,by:i.created_by,txt:`registró una entrevista con <b>${esc(i.person)}</b>`}));
  T.logs.forEach(l=>it.push({t:l.created_at,by:l.created_by,txt:`escribió en la bitácora${l.pivot?" un <b>pivote</b>":""}`}));
  T.feedback.forEach(f=>it.push({t:f.created_at,by:f.created_by,txt:`comentó sobre <b>${esc(f.block==="general"?"el proyecto":BN[f.block])}</b>: “${esc(trim(f.text,80))}”`}));
  T.snaps.forEach(s=>it.push({t:s.created_at,by:s.created_by,txt:`guardó la versión <b>${esc(s.label)}</b> del canvas`}));
  T.closures.forEach(c=>it.push({t:c.updated_at||c.created_at,by:c.closed_by,auto:c.auto,txt:`cerró la semana del <b>${fmtDay(c.week)}</b> (${(c.stats.totals||{}).changes||0} cambios en el canvas)`}));
  it.sort((a,b)=>String(b.t).localeCompare(String(a.t)));
  if(!it.length)return`<p class="muted" style="margin:0">Todavía no hay actividad. Empiecen agregando hipótesis en el Canvas o registrando su primera entrevista.</p>`;
  return `<ul class="feed">${it.slice(0,10).map(x=>`<li>${av(x.by)}<div><b>${esc(x.auto?"Cierre automático":nameOf(x.by))}</b> ${x.auto?x.txt.replace(/^cerró/,"·"):x.txt}<div class="when">${ago(x.t)}</div></div></li>`).join("")}</ul>`;
}

/* --- Canvas --- */
function vCanvas(){
  if(!T.team.tool)return `<div class="viewhead"><div><h2>Herramienta del equipo</h2></div></div><div class="empty"><h3>${T.isTeacher?"Este equipo aún no tiene herramienta asignada":"Tu profesor/a aún no asigna la herramienta de este equipo"}</h3><p>${T.isTeacher?"Asígnala desde el panel del curso (columna Herramienta).":"Mientras tanto pueden registrar entrevistas y escribir la bitácora."}</p></div>`;
  if(T.team.tool==="valuelab")return vValueLab();
  const ev=evidence(),fbc={};T.feedback.filter(f=>!f.resolved).forEach(f=>fbc[f.block]=(fbc[f.block]||0)+1);
  const ed=canEdit();
  return `<div class="viewhead"><div><h2>Business Model Canvas</h2><p>Cada nota es una hipótesis. Ábrela para cambiar su estado; la evidencia sale de las entrevistas.</p></div><span class="spacer"></span><div class="legend"><span class="chip st-pending">Por validar</span><span class="chip st-valid">Validada</span><span class="chip st-invalid">Invalidada</span></div></div>
  <div class="canvas">${BLOCKS.map(b=>{const hs=hypsOf(b.k);
    return `<section class="blk${b.big?" big":""}" style="grid-area:${b.k}" aria-label="${esc(b.n)}"><header><h3>${b.n}</h3><span class="cnt">${fbc[b.k]?`<span class="fbdot" title="Comentarios abiertos">● ${fbc[b.k]}</span>`:""}<span>${hs.length}</span></span></header><p class="q">${b.q}</p>
    <div class="hyps">${hs.map(h=>{const e=ev[h.id];return `<button class="hyp" data-act="hyp" data-id="${esc(h.id)}"><span class="t">${esc(h.text)}</span><span class="meta"><span class="chip st-${h.status}">${ST[h.status]}</span>${e?`<span class="ev"><span class="a">+${e.a}</span> <span class="r">−${e.r}</span></span>`:""}</span></button>`}).join("")||`<span class="empty-blk">Sin hipótesis todavía.</span>`}</div>
    ${ed?`<form class="addf" data-form="addhyp" data-block="${b.k}"><input id="add-${b.k}" data-keep placeholder="Nueva hipótesis…" aria-label="Nueva hipótesis en ${esc(b.n)}" maxlength="400"><button class="btn sm" type="submit">Agregar</button></form>`:""}</section>`}).join("")}</div>`;
}
function hypModal(id){
  const h=T.hyps.find(x=>x.id===id);if(!h)return;const ed=canEdit();
  const evs=T.interviews.filter(iv=>iv.evidence&&iv.evidence[id]);
  const fbs=T.feedback.filter(f=>f.block===h.block&&!f.resolved);
  let status=h.status;
  const isVL=T.team.tool==="valuelab";
  const stHtml=bk=>blockOf(bk).nostatus?`<span class="muted" style="font-size:13px">Este componente no tiene estado.</span>`:`<div class="statusbtns">${Object.entries(stOf(bk)).map(([k,n])=>`<button type="button" class="${k}" data-st="${k}" aria-pressed="${k===status}" ${ed?"":"disabled"}>${esc(n)}</button>`).join("")}</div>`;
  const parHtml=bk=>{const pks=parentsOf(bk);if(!isVL||!pks.length)return"";
    return `<label for="m-parent">Vinculado a</label><select id="m-parent" ${ed?"":"disabled"}><option value="">Sin vincular</option>${pks.map(pk=>{const opts=hypsOf(pk).filter(x=>x.id!==id);return opts.length?`<optgroup label="${esc(BN[pk])}">${opts.map(o=>`<option value="${esc(o.id)}" ${o.id===h.parent_id?"selected":""}>${esc(trim(hText(o),90))}</option>`).join("")}</optgroup>`:""}).join("")}</select>`};
  const isIT=bk=>!!blockOf(bk).ifthen;
  const md=openModal(`<h2>${isVL?"Elemento del Value Lab":"Hipótesis"}</h2>
  <div class="field"><label for="m-text" id="m-textlab">${isIT(h.block)?"SI":"Enunciado"}</label><textarea id="m-text" ${ed?"":"readonly"} maxlength="400">${esc(h.text)}</textarea></div>
  <div class="field" id="m-thenwrap" ${isIT(h.block)?"":"hidden"}><label for="m-then">ENTONCES</label><textarea id="m-then" ${ed?"":"readonly"} maxlength="400">${esc(h.then_text||"")}</textarea></div>
  <div class="fgrid"><div class="field"><label for="m-block">${isVL?"Componente":"Bloque"}</label><select id="m-block" ${ed?"":"disabled"}>${toolBlocks().map(b=>`<option value="${b.k}" ${b.k===h.block?"selected":""}>${b.n}</option>`).join("")}</select></div>
  <div class="field"><label>Estado</label><div id="m-stwrap">${stHtml(h.block)}</div></div>
  <div class="field full" id="m-parwrap">${parHtml(h.block)}</div></div>
  <div><div class="label">Evidencia de entrevistas</div>${evs.length?`<div class="evrow">${evs.map(iv=>`<span class="evchip ${iv.evidence[id]}">${iv.evidence[id]==="apoya"?"Apoya":"Refuta"} · ${esc(iv.person)} · ${fmtDay(iv.interview_date)}</span>`).join("")}</div>`:`<p class="muted" style="margin:4px 0 0">Ninguna entrevista ha evaluado esta ${itemWord()}.</p>`}</div>
  ${fbs.length?`<div><div class="label">Comentarios abiertos en este bloque</div>${fbs.map(f=>`<p style="margin:6px 0 0;font-size:14px"><b>${esc(nameOf(f.created_by))}:</b> ${esc(f.text)}</p>`).join("")}</div>`:""}
  <p class="muted" style="margin:0;font-size:12.5px">Creada por ${esc(nameOf(h.created_by))} ${ago(h.created_at)}${h.updated_at?` · editada ${ago(h.updated_at)} por ${esc(nameOf(h.updated_by))}`:""}</p>

function vlItem(h,ev,byId){
  const e=ev[h.id],b=blockOf(h.block),par=h.parent_id&&byId[h.parent_id];

  const parl=par?`<span class="par">↳ ${esc(trim(hText(par),70))}</span>`:"";
  if(b.ifthen)return `<button class="hyp ift" data-act="hyp" data-id="${esc(h.id)}"><span class="il">SI</span><span class="t">${esc(h.text)}</span><span class="il">ENTONCES</span><span class="t">${h.then_text?esc(h.then_text):`<span class="muted">(falta completar)</span>`}</span>${parl}${meta}</button>`;
  return `<button class="hyp" data-act="hyp" data-id="${esc(h.id)}"><span class="t">${esc(h.text)}</span>${parl}${meta}</button>`;

function vlPart(k,ev,byId,fbc,opts){

  const add=!ed?"":b.ifthen
    ?`<form class="addf two" data-form="addhyp" data-block="${k}"><span class="il">SI</span><input id="add-${k}" data-keep placeholder="${esc(b.ph)}" aria-label="Si" maxlength="400"><span class="il">ENTONCES</span><input id="add-${k}-then" data-keep data-then placeholder="${esc(b.ph2)}" aria-label="Entonces" maxlength="400"><button class="btn sm" type="submit">Agregar</button></form>`
    :`<form class="addf" data-form="addhyp" data-block="${k}"><input id="add-${k}" data-keep placeholder="${esc(b.ph)}" aria-label="Nuevo elemento en ${esc(b.n)}" maxlength="400"><button class="btn sm" type="submit">Agregar</button></form>`;

  return `<div class="vlpart" aria-label="${esc(b.n)}"><header>${title}<span class="cnt">${fbc[k]?`<span class="fbdot" title="Comentarios abiertos">● ${fbc[k]}</span> `:""}${range}</span></header>${b.note?`<span class="vlnote">${b.note}</span>`:""}${q}
    <div class="hyps">${hs.map(h=>vlItem(h,ev,byId)).join("")||`<span class="empty-blk">Sin elementos todavía.</span>`}</div>${add}</div>`;

function vVersiones(){

    const added=T.hyps.filter(h=>!old[h.id]),removed=items.filter(i=>!cur[i.id]),changed=T.hyps.filter(h=>old[h.id]&&(old[h.id].status!==h.status||old[h.id].text!==h.text||old[h.id].block!==h.block));
    const li=(arr,f)=>arr.length?`<ul>${arr.map(f).join("")}</ul>`:`<p class="muted" style="margin:6px 0 0;font-size:13.5px">Ninguna</p>`;
    diff=`<div class="panel" style="margin-top:14px"><h3>Cambios desde “${esc(sel.label)}”</h3><p class="muted" style="margin:-4px 0 12px;font-size:13px">Guardada por ${esc(nameOf(sel.created_by))} el ${fmtDay(sel.created_at)} · ${items.length} hipótesis</p>
    <div class="diff"><div><div class="label">Nuevas (${added.length})</div>${li(added,h=>`<li><b>${esc(BN[h.block])}:</b> ${esc(trim(h.text,90))}</li>`)}</div>
    <div><div class="label">Eliminadas (${removed.length})</div>${li(removed,h=>`<li><b>${esc(BN[h.block])}:</b> ${esc(trim(h.text,90))}</li>`)}</div>

  }

/* --- Cierres semanales --- */
const SK=[["total","Total"],["valid","Validadas"],["invalid","Invalidadas"],["pending","Por validar"],["added","Nuevas"],["removed","Eliminadas"],["moved_in","Movidas aquí"],["edited","Texto editado"],["validated","Validadas en la semana"],["invalidated","Invalidadas en la semana"],["changes","Cambios"]];
const SKEYS=["total","valid","invalid","pending","added","removed","moved_in","edited","validated","invalidated","reopened","status_changed","changes"];
// Mismo cálculo que la función _close_week de la base de datos (para la vista previa)
function computeClosure(cur,prev){
  const P={},C={};(prev||[]).forEach(i=>P[i.id]=i);cur.forEach(i=>C[i.id]=i);
  const blocks={};ALLB.forEach(b=>{blocks[b.k]={};SKEYS.forEach(k=>blocks[b.k][k]=0)});
  for(const c of cur){const s=blocks[c.block];if(!s)continue;const p=P[c.id];
    s.total++;s[c.status]++;
    if(!p)s.added++;else{if(p.block!==c.block)s.moved_in++;if(p.text!==c.text||(p.then_text||"")!==(c.then_text||""))s.edited++;if(p.status!==c.status){s.status_changed++;if(c.status==="pending")s.reopened++}}
    if(c.status==="valid"&&(!p||p.status!=="valid"))s.validated++;
    if(c.status==="invalid"&&(!p||p.status!=="invalid"))s.invalidated++;}
  for(const p of prev||[])if(!C[p.id]&&blocks[p.block])blocks[p.block].removed++;
  const totals={};SKEYS.forEach(k=>totals[k]=0);
  for(const s of Object.values(blocks)){s.changes=s.added+s.removed+s.moved_in+s.edited+s.status_changed;SKEYS.forEach(k=>totals[k]+=s[k])}
  return{blocks,totals};
}
function statsTable(st,bl){
  const n=v=>Number(v)||0;
  const NS=new Set(["valid","invalid","pending","validated","invalidated"]);
  const rows=(bl||toolBlocks()).map(b=>{const s=st.blocks[b.k]||{};return `<tr><td>${b.n}</td>${SK.map(([k])=>b.nostatus&&NS.has(k)?`<td class="num muted">—</td>`:`<td class="num${k==="changes"?" hl":""}"${k==="valid"&&n(s[k])?' style="color:var(--ok)"':k==="invalid"&&n(s[k])?' style="color:var(--bad)"':""}>${n(s[k])}</td>`).join("")}</tr>`}).join("");
  const tot=`<tr class="tot"><td>Total</td>${SK.map(([k])=>`<td class="num">${n((st.totals||{})[k])}</td>`).join("")}</tr>`;
  return `<div class="tablewrap"><table class="stats"><thead><tr><th>Componente</th>${SK.map(([,l])=>`<th>${l}</th>`).join("")}</tr></thead><tbody>${rows}${tot}</tbody></table></div>`;
}
function miniStats(t){const n=v=>Number(v)||0;
  return `<div class="mini"><div><b>${n(t.changes)}</b><span>cambios</span></div><div><b>${n(t.added)}</b><span>nuevas</span></div><div><b style="color:var(--ok)">${n(t.validated)}</b><span>validadas en la semana</span></div><div><b style="color:var(--bad)">${n(t.invalidated)}</b><span>invalidadas en la semana</span></div><div><b>${n(t.removed)}</b><span>eliminadas</span></div><div><b>${n(t.total)}</b><span>hipótesis en total</span></div></div>`}
function evoChart(list){
  const W=600,H=230,L=34,R=14,Tp=14,B=30;const n=list.length;
  const val=(c,k)=>Number((c.stats.totals||{})[k])||0;
  const max=Math.max(1,...list.map(c=>val(c,"total")));const step=Math.max(1,Math.ceil(max/5));const top=step*5;
  const x=i=>n===1?(L+W-R)/2:L+i*(W-L-R)/(n-1),y=v=>Tp+(H-Tp-B)*(1-v/top);
  let g="";for(let t=0;t<=top;t+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${t}</text>`;
  const every=Math.ceil(n/8);
  const xl=list.map((c,i)=>i%every===0||i===n-1?`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${fmtShort(parseDay(c.week))}</text>`:"").join("");
  const ser=[["total","Total de hipótesis","var(--accent)"],["valid","Validadas","var(--ok)"],["invalid","Invalidadas","var(--bad)"]];
  const lines=ser.slice().reverse().map(([k,,col])=>{const pts=list.map((c,i)=>`${x(i)},${y(val(c,k))}`).join(" ");const li=n-1;
    return `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round"${k==="invalid"?' stroke-dasharray="6 4"':""}/>${list.map((c,i)=>`<circle cx="${x(i)}" cy="${y(val(c,k))}" r="${i===li?4:2.6}" fill="${col}"><title>Semana del ${fmtDay(c.week)}: ${val(c,k)}</title></circle>`).join("")}`}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-width:720px" role="img" aria-label="Evolución del canvas por semana" preserveAspectRatio="xMinYMid meet">${g}${xl}${lines}</svg><div class="chartlegend">${ser.map(([k,l,c])=>`<span><i class="${k==="invalid"?"dash":""}" style="background:${c};color:${c}"></i>${l}</span>`).join("")}</div>`;
}
function vCierres(){
  const head=`<div class="viewhead"><div><h2>Cierres semanales</h2><p>Cada cierre guarda una foto del canvas y cuenta qué cambió respecto del cierre anterior: elementos nuevos, eliminados, validados, invalidados y editados en cada componente.</p></div></div>`;
  if(T.closuresErr)return head+`<div class="banner warn">Esta función necesita actualizar la base de datos: en Supabase abre <b>SQL Editor</b>, pega de nuevo el archivo <b>schema.sql</b> y presiona <b>Run</b>.</div>`;
  const wk=thisWeek();
  const cur=T.closures.find(c=>c.week===wk);
  const prev=T.closures.find(c=>c.week<wk);
  const pv=computeClosure(T.hyps.map(h=>({id:h.id,block:h.block,text:h.text,then_text:h.then_text||"",status:h.status})),prev?prev.items:[]);
  const past=T.closures;const sel=past.find(c=>c.id===T.closureSel)||past[0];
  const asc=past.slice().reverse();
  return head+`<div class="panel" style="margin-bottom:16px">
    <div class="item-h"><h3 style="margin:0">Semana del ${fmtDay(wk)}</h3>${cur?`<span class="chip st-valid">Cerrada</span>`:`<span class="chip st-pending">Sin cerrar</span>`}</div>
    <p class="muted" style="margin:6px 0 0;font-size:14px">${cur?`Cerrada ${cur.auto?"automáticamente":"por "+esc(nameOf(cur.closed_by))} ${ago(cur.updated_at||cur.created_at)}. Si hicieron cambios después, pueden volver a cerrarla y el registro se actualiza.`:`Esto es lo que quedará registrado al cerrar, comparado con ${prev?"el cierre de la semana del "+fmtDay(prev.week):"un canvas vacío (es el primer cierre, así que todo cuenta como nuevo)"}.`}</p>
    ${miniStats(pv.totals)}
    ${statsTable(pv)}
    ${canEdit()?`<form data-form="closeweek" style="display:grid;gap:8px;margin-top:12px"><label class="label" for="cw-note">Comentario del cierre (opcional)</label><textarea id="cw-note" data-keep maxlength="1000" style="border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-height:60px;resize:vertical" placeholder="Ej.: Esta semana confirmamos que el precio no es el problema; el problema es el tiempo.">${cur?"":""}</textarea><div><button class="btn primary" type="submit">${cur?"Volver a cerrar con los cambios recientes":"Cerrar semana"}</button></div></form>`:""}
  </div>
  ${past.length>=2?`<div class="panel" style="margin-bottom:16px"><h3>Evolución del canvas</h3>${evoChart(asc)}</div>`:""}
  ${past.length?`<h3 style="font-size:18px;margin:0 0 10px">Historial de cierres</h3><div class="snaps">${past.map(c=>`<button class="snap" data-act="closuresel" data-id="${esc(c.id)}" aria-pressed="${sel&&c.id===sel.id}"><b>Semana del ${fmtDay(c.week)}</b><span class="muted mono" style="font-size:12.5px">${(c.stats.totals||{}).changes||0} cambios · ${(c.stats.totals||{}).total||0} hipótesis · ${c.auto?"automático":esc(nameOf(c.closed_by))}</span></button>`).join("")}</div>
    ${sel?`<div class="panel" style="margin-top:14px"><h3>Semana del ${fmtDay(sel.week)}</h3>
      <p class="muted" style="margin:-4px 0 0;font-size:13.5px">${sel.auto?"Cierre automático":"Cerrada por "+esc(nameOf(sel.closed_by))} el ${fmtDay(sel.updated_at||sel.created_at)} · comparado con ${sel.stats.baseline_week?"la semana del "+fmtDay(sel.stats.baseline_week):"un canvas vacío"} · ${Number(sel.stats.interviews_week)||0} entrevistas en la semana · bitácora ${sel.stats.log_written?"escrita":"sin escribir"}</p>
      ${sel.note?`<p style="margin:10px 0 0;white-space:pre-wrap">${esc(sel.note)}</p>`:""}
      ${miniStats(sel.stats.totals||{})}${statsTable(sel.stats)}
      ${T.isTeacher?`<div style="margin-top:12px;display:flex;justify-content:flex-end"><span><button class="btn sm ghost" data-act="closuredel" data-id="${esc(sel.id)}">Eliminar este cierre</button></span></div>`:""}</div>`:""}`
  :`<div class="empty"><h3>Aún no hay cierres</h3><p>Al final de cada semana, cierren la semana para dejar registro de cómo cambió el canvas.</p></div>`}`;
}

function closeModal(){$("#modalroot").innerHTML="";if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}
function confirmDel(md,msg,fn){const box=md.querySelector("#m-del");if(!box)return;box.querySelector("[data-del]").onclick=()=>{box.innerHTML=`<span style="font-size:13px">${esc(msg)}</span> <button class="btn danger sm" data-yes>Sí, eliminar</button> <button class="btn ghost sm" data-no>No</button>`;
  box.querySelector("[data-yes]").onclick=e=>{e.target.disabled=true;fn()};box.querySelector("[data-no]").onclick=()=>{box.innerHTML=`<button class="btn danger sm" data-del>Eliminar</button>`;confirmDel(md,msg,fn)}}}
// Confirmación en línea dentro de la página (sin ventanas emergentes)
function inlineConfirm(t,text,act,id){const span=document.createElement("span");span.style.cssText="display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap";span.innerHTML=`<span style="font-size:13px">${esc(text)}</span><button class="btn danger sm" data-act="${act}" data-id="${esc(id||"")}">Sí</button><button class="btn ghost sm" data-act="norender">No</button>`;t.replaceWith(span)}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modalroot").innerHTML)closeModal();
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("article[data-act]")){e.preventDefault();e.target.click()}});

function exportTeam(){
  const t=T.team;
  const data={equipo:{nombre:t.name,descripcion:t.description,metaSemanal:t.goal,curso:T.course?.name},exportado:now(),
    integrantes:T.members.map(m=>({nombre:realName(m.user_id),rol:m.role})),
    herramienta:TOOLS[T.team.tool]||"Sin asignar",
    canvas:toolBlocks().map(b=>({bloque:b.n,elementos:hypsOf(b.k).map(h=>({texto:h.text,...(b.ifthen?{entonces:h.then_text||""}:{}),estado:b.nostatus?null:stOf(b.k)[h.status],vinculadoA:h.parent_id?((T.hyps.find(x=>x.id===h.parent_id)||{}).text||null):null}))})),
    entrevistas:T.interviews.map(i=>({persona:i.person,cargo:i.person_role,segmento:i.segment,fecha:i.interview_date,modalidad:i.channel,notas:i.notes,aprendizaje:i.insights,
      evidencia:Object.entries(i.evidence||{}).map(([h,v])=>({hipotesis:(T.hyps.find(x=>x.id===h)||{}).text||"(eliminada)",resultado:v}))})),
    bitacora:T.logs.map(l=>({semana:l.week,titulo:l.title,aprendimos:l.learned,cambiamos:l.changed,proximosPasos:l.next_steps,pivote:l.pivot})),
    retroalimentacion:T.feedback.map(f=>({autor:realName(f.created_by),sobre:f.block==="general"?"General":BN[f.block],texto:f.text,fecha:f.created_at,resuelto:f.resolved})),
    versiones:T.snaps.map(s=>({nombre:s.label,fecha:s.created_at,hipotesis:(s.items||[]).length})),
    cierres:T.closures.map(c=>({semana:c.week,automatico:c.auto,comentario:c.note,totales:c.stats.totals,porComponente:Object.fromEntries(toolBlocks().map(b=>[b.n,(c.stats.blocks||{})[b.k]||{}]))}))};
  download(slug(t.name)+"-bitacora.json",JSON.stringify(data,null,2),"application/json");
}
function exportClosures(){
  const tn=Object.fromEntries(C.teams.map(t=>[t.id,t.name]));
  const tt=Object.fromEntries(C.teams.map(t=>[t.id,t.tool]));const tl=id=>TOOLSHORT[tt[id]]||"Sin asignar";
  const head=["Equipo","Herramienta","Semana (lunes)","Componente",...SK.map(([,l])=>l),"Entrevistas en la semana","Bitácora escrita","Cerrado por","Comentario"];
  const rows=[];
  C.closures.slice().sort((a,b)=>(tn[a.team_id]||"").localeCompare(tn[b.team_id]||"")||String(a.week).localeCompare(String(b.week))).forEach(c=>{
    const who=c.auto?"Automático":realName(c.closed_by);
    blocksFor(tt[c.team_id]).forEach(b=>{const s=(c.stats.blocks||{})[b.k]||{};rows.push([tn[c.team_id],tl(c.team_id),c.week,b.n,...SK.map(([k])=>Number(s[k])||0),"","","",""])});
    const t=c.stats.totals||{};rows.push([tn[c.team_id],tl(c.team_id),c.week,"TOTAL",...SK.map(([k])=>Number(t[k])||0),Number(c.stats.interviews_week)||0,c.stats.log_written?"Sí":"No",who,c.note||""]);
  });
  const csv="\ufeff"+[head,...rows].map(r=>r.map(csvCell).join(";")).join("\n");
  download(slug(C.course.name)+"-cierres-"+today()+".csv",csv,"text/csv;charset=utf-8");
}
function exportCourse(){
  const head=["Equipo","Herramienta","Estudiantes","Mentores","Entrevistas semana","Entrevistas total","Meta semanal","Hipótesis validadas","Hipótesis invalidadas","Hipótesis total","Última bitácora","Pivotes","Comentarios abiertos","Integrantes","Código estudiantes","Código mentores"];
  const rows=C.teams.map(t=>{const s=C.stats[t.id];return [t.name,TOOLSHORT[t.tool]||"Sin asignar",s.est,s.men,s.ivw,s.iv,t.goal,s.hv,s.hi,s.ht,s.lastLog||"",s.piv,s.fb,s.ids.map(realName).join(" / "),t.student_code,t.mentor_code]});
  const csv="﻿"+[head,...rows].map(r=>r.map(csvCell).join(";")).join("\n");
  download(slug(C.course.name)+"-resumen-"+today()+".csv",csv,"text/csv;charset=utf-8");
}

document.addEventListener("click",async e=>{
